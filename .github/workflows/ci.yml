name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The offline copy's tests start Pyodide under Node (tests/test_offline.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Byte-compile
        run: python -m compileall -q app.py pipeline web

      # Pyodide and the wheels for the offline copy (18 MB, pinned by SHA-256 in web/offline.py).
      - uses: actions/cache@v4
        with:
          path: web/offline_rt
          key: offline-rt-${{ hashFiles('web/offline.py') }}

      - name: Fetch the offline runtime
        run: python web/offline.py fetch-runtime

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Service worker tests
        run: node tests/test_sw.js
